name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-validation:
    name: Release validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/tpg-scheduler-codex-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins/tpg-scheduler-codex-plugin/package-lock.json

      - name: Install
        run: npm ci

      - name: Validate plugin
        run: npm run validate

      - name: Test
        run: npm test
